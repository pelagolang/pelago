# Tag push `v*` builds every target and publishes the release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      channel: ${{ steps.info.outputs.channel }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      latest: ${{ steps.info.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: info
        name: Check the tag
        run: |
          python3 tools/release/release.py tag-info "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          python3 tools/release/release.py check-tag "$GITHUB_REF_NAME"
      - name: Release helper tests
        run: python3 tools/release/test_release.py

  build:
    needs: plan
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      ref: ${{ github.sha }}

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: python3 tools/release/release.py sums dist
      - name: Sign the checksums (Ed25519)
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set: a release must be signed"
            exit 1
          fi
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/key.pem" -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/key.pem"
          if [ -f docs/release/pelago-release.pub ] && grep -q 'BEGIN PUBLIC KEY' docs/release/pelago-release.pub; then
            openssl pkeyutl -verify -rawin -pubin -inkey docs/release/pelago-release.pub -in dist/SHA256SUMS -sigfile dist/SHA256SUMS.sig
          else
            echo "::warning::docs/release/pelago-release.pub is not committed yet, the signature was not verified"
          fi
      - name: Release notes
        run: |
          prev="$(git tag --list 'v*' --sort=-v:refname | grep -v -F "$GITHUB_REF_NAME" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ "${{ needs.plan.outputs.channel }}" != stable ]; then
            prev="$(git tag --list 'v*' --sort=-v:refname | grep -v -F "$GITHUB_REF_NAME" | head -n1 || true)"
          fi
          {
            echo "Channel: **${{ needs.plan.outputs.channel }}**. Verify with \`SHA256SUMS\` and \`SHA256SUMS.sig\` (docs: verifying releases). Windows binaries are not Authenticode-signed."
            echo
            python3 tools/release/release.py notes --to "$GITHUB_REF_NAME" ${prev:+--from "$prev"}
          } > notes.md
      - name: Create the release
        run: |
          args=(--title "Pelago ${{ needs.plan.outputs.version }}" --notes-file notes.md --verify-tag)
          if [ "${{ needs.plan.outputs.prerelease }}" = true ]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" dist/*
