# Daily nightly build of `main` (card B-06). Runs only when main changed since the last nightly and its
# CI is green. One rolling pre-release, tag `nightly`, keeps the last 14 builds as assets.
name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if main has not changed (CI must still be green)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
      sha: ${{ steps.decide.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: decide
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          last="$(gh release view nightly --json body --jq .body 2>/dev/null | sed -n 's/^commit: //p' | head -n1 || true)"
          if [ "$last" = "$sha" ] && [ "${{ inputs.force }}" != true ]; then
            echo "main has not changed since the last nightly ($sha)"
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # CI must be green on this exact commit: all five ci jobs finished and succeeded.
          ok="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" --jq '[.check_runs[] | select(.name | IN("check","windows","arm","windows-arm","macos"))] | if length >= 5 and all(.status == "completed" and .conclusion == "success") then "yes" else "no" end')"
          if [ "$ok" != yes ]; then
            echo "CI is not green (or not finished) on $sha, skipping tonight"
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git tag --list 'v*' > "$RUNNER_TEMP/tags.txt"
          version="$(python3 tools/release/release.py nightly-version --date "$(date -u +%Y%m%d)" --sha "$sha" --tags "$RUNNER_TEMP/tags.txt")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "building $version"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      ref: ${{ needs.plan.outputs.sha }}

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Checksums and signature
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          python3 tools/release/release.py sums dist
          mv dist/SHA256SUMS "dist/SHA256SUMS-$VERSION"
          if [ -n "$KEY" ]; then
            umask 077
            printf '%s\n' "$KEY" > "$RUNNER_TEMP/key.pem"
            openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/key.pem" -in "dist/SHA256SUMS-$VERSION" -out "dist/SHA256SUMS-$VERSION.sig"
            rm -f "$RUNNER_TEMP/key.pem"
          else
            echo "::warning::RELEASE_SIGNING_KEY is not set: this nightly has checksums but no signature"
          fi
      - name: Move the nightly tag and publish
        run: |
          git tag -f nightly "$SHA"
          git push -f origin refs/tags/nightly
          prev="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          {
            echo "commit: $SHA"
            echo "version: $VERSION"
            echo
            echo "Rolling nightly build of main (last 14 builds are kept as assets). Not for production use."
            echo
            python3 tools/release/release.py notes --to "$SHA" ${prev:+--from "$prev"}
          } > notes.md
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --notes-file notes.md --title "Pelago nightly" --prerelease --latest=false
          else
            gh release create nightly --title "Pelago nightly" --notes-file notes.md --prerelease --latest=false --verify-tag
          fi
          gh release upload nightly dist/* --clobber
      - name: Prune old builds
        run: |
          gh release view nightly --json assets --jq '.assets[].name' > assets.txt
          python3 tools/release/release.py prune-nightlies --names assets.txt --keep 14 | while read -r name; do
            gh release delete-asset nightly "$name" --yes
          done
