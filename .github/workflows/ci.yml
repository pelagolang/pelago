name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The AArch64 backend (card A-10): its programs run under qemu here, and its encoder is checked
      # against the real assembler.
      - run: sudo apt-get update && sudo apt-get install -y qemu-user binutils-aarch64-linux-gnu
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo run -- fmt --check examples

  # The native backend runs its programs for real: Linux ones above, Windows ones here (no WSL, no Wine).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all

  # The AArch64 programs run for real on an ARM machine (the x86-64 ones are skipped there).
  arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y binutils
      - run: cargo test --all

  # The AArch64 Windows programs run for real on a Windows ARM machine (the x86-64 ones are skipped there).
  windows-arm:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all
