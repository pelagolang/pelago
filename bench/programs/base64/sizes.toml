# Replacements applied to the source text of every twin; the committed source is the medium size.
# kostya runs 8192 tries; medium is 256.
[small]
replace = [["for t in 0..256", "for t in 0..32"], ["t < 256", "t < 32"], ["for _ in 0..256", "for _ in 0..32"]]

[large]
replace = [["for t in 0..256", "for t in 0..2048"], ["t < 256", "t < 2048"], ["for _ in 0..256", "for _ in 0..2048"]]
